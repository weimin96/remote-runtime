[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-agent-gateway"
version = "0.99.11"
description = "A secure remote execution runtime for AI coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp>=1.29,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=14,<18",
]

[project.scripts]
remote-gateway = "gateway.__main__:main"
remote-agent = "remote_agent.cli:main"
remote-project = "gateway.project_cli:main"

[tool.setuptools]
py-modules = ["agent"]

[tool.setuptools.packages.find]
include = ["gateway*", "remote_agent*"]

[tool.setuptools.package-data]
gateway = ["static/*", "installers/*"]
remote_agent = ["manifest.json"]

services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://127.0.0.1:8000}
      GATEWAY_SECURE_COOKIES: ${GATEWAY_SECURE_COOKIES:-false}
      GATEWAY_DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - gateway-data:/app/data

volumes:
  gateway-data:

